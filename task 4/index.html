<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR: размещение объекта через hit-test (Three.js)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    canvas { display: block; }
    #ar-btn {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      padding: 12px 26px; border: none; border-radius: 999px;
      background: #5b9dff; color: #0e1116; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 6px 18px rgba(91,157,255,.35); z-index: 10;
    }
    #ar-btn:disabled { background: #3a4150; color: #9aa4b2; box-shadow: none; cursor: default; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./js/three.module.min.js",
        "three/addons/": "./js/addons/"
      }
    }
  </script>
</head>
<body>
  <button id="ar-btn" disabled>Проверка поддержки AR…</button>
  <script type="module" src="main.js"></script>
</body>
</html>
