<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WebAR: базовый сценарий на model-viewer</title>
  <script type="module" src="js/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --accent: #5b9dff;
      --text: #eef1f6;
      --muted: #9aa4b2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(14,17,22,.9), rgba(14,17,22,0));
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .2px;
    }
    header span {
      font-size: 12px;
      color: var(--muted);
    }
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #171b22;
      --poster-color: transparent;
    }
    model-viewer::part(default-ar-button) {
      display: none; /* прячем стандартную кнопку — используем собственную ниже */
    }
    #ar-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #0e1116;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(91,157,255,.35);
    }
    #ar-btn svg { width: 18px; height: 18px; }
    #status {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      background: rgba(20,24,31,.7);
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Задание 1 · WebAR: &lt;model-viewer&gt;</h1>
    <span>Модель: Astronaut (glTF / USDZ)</span>
  </header>

  <model-viewer
    id="viewer"
    src="models/Astronaut.glb"
    ios-src="models/Astronaut.usdz"
    alt="3D-модель скафандра астронавта"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    interaction-prompt="none"
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="18deg"
    shadow-intensity="1"
    shadow-softness="0.9"
    exposure="1.05"
    environment-image="neutral"
    camera-orbit="20deg 78deg 4.9m"
    min-camera-orbit="auto 35deg auto"
    max-camera-orbit="auto 110deg auto"
  >
    <div slot="progress-bar" id="status"></div>
  </model-viewer>

  <button id="ar-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2 3 7v10l9 5 9-5V7z" />
      <path d="M3 7l9 5 9-5" />
      <path d="M12 12v10" />
    </svg>
    Посмотреть в AR
  </button>

  <script>
    const viewer = document.getElementById('viewer');
    const arBtn = document.getElementById('ar-btn');
    const status = document.getElementById('status');

    // Кастомная кнопка вызывает встроенный AR-режим model-viewer
    arBtn.addEventListener('click', () => viewer.activateAR());

    // Показываем/скрываем кнопку в зависимости от поддержки AR на устройстве
    viewer.addEventListener('ar-status', (event) => {
      status.style.display = 'block';
      switch (event.detail.status) {
        case 'session-started':
          status.textContent = 'AR-сессия запущена';
          break;
        case 'object-placed':
          status.textContent = 'Модель размещена в комнате';
          break;
        case 'failed':
          status.textContent = 'Не удалось запустить AR на этом устройстве';
          break;
        case 'not-presenting':
          status.style.display = 'none';
          break;
      }
    });

    viewer.addEventListener('load', () => {
      console.log('[model-viewer] модель загружена, доступные AR-режимы:', viewer.canActivateAR);
    });
  </script>
</body>
</html>
