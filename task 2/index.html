<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR: трекинг изображения (MindAR + A-Frame)</title>
  <script>
    // Некоторые устройства/браузеры (и headless-тестирование) отдают WebGL
    // только через программный рендерер, который помечается как
    // "major performance caveat". tfjs-бэкенд MindAR по умолчанию
    // отказывается создавать контекст в этом случае — снимаем ограничение.
    (function () {
      const orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (attrs && attrs.failIfMajorPerformanceCaveat) {
          attrs = Object.assign({}, attrs, { failIfMajorPerformanceCaveat: false });
        }
        return orig.call(this, type, attrs);
      };
    })();
  </script>
  <script src="js/aframe.min.js"></script>
  <script src="js/mindar-image-aframe.prod.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --accent: #5b9dff;
      --text: #eef1f6;
      --muted: #9aa4b2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      overflow: hidden;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(14,17,22,.9), rgba(14,17,22,0));
      z-index: 10;
      pointer-events: none;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header span { font-size: 12px; color: var(--muted); }
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,24,31,.8);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 10;
      transition: opacity .3s;
    }
    #hint.found { background: rgba(60, 160, 100, .85); }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Задание 2 · Image tracking (MindAR)</h1>
    <span>Маркер: скриншот Задания 1</span>
  </header>
  <div id="hint">Наведите камеру на маркер (скриншот Задания 1)</div>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="astronaut" src="models/Astronaut.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- базовое освещение сцены -->
      <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
      <a-entity light="type: directional; intensity: 0.7; color: #ffffff" position="1 2 1"></a-entity>

      <a-gltf-model
        id="model"
        src="#astronaut"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.12 0.12 0.12"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const hint = document.getElementById('hint');
    const targetEl = document.querySelector('[mindar-image-target]');

    targetEl.addEventListener('targetFound', () => {
      hint.textContent = 'Маркер найден — модель размещена';
      hint.classList.add('found');
      console.log('[mindar] targetFound');
    });
    targetEl.addEventListener('targetLost', () => {
      hint.textContent = 'Наведите камеру на маркер (скриншот Задания 1)';
      hint.classList.remove('found');
      console.log('[mindar] targetLost');
    });
  </script>
</body>
</html>
