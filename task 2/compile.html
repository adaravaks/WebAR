<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>compile</title></head>
<body>
<script>
  // Headless Chrome only has a software (swiftshader) GL renderer available,
  // which Chrome reports as a "major performance caveat". The bundled
  // tensorflow.js backend requests a WebGL context with
  // failIfMajorPerformanceCaveat:true, so context creation is refused.
  // Force that flag off so the software renderer is accepted.
  const _origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (attrs && attrs.failIfMajorPerformanceCaveat) {
      attrs = Object.assign({}, attrs, { failIfMajorPerformanceCaveat: false });
    }
    return _origGetContext.call(this, type, attrs);
  };
</script>
<script type="module">
  import { Compiler } from './js/mindar-image.prod.js';

  window.__compileStatus = 'running';

  async function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  (async () => {
    try {
      const img = await loadImage('./assets/marker.png');
      const compiler = new Compiler();
      await compiler.compileImageTargets([img], (progress) => {
        window.__compileProgress = progress;
      });
      const buffer = compiler.exportData(); // Uint8Array -> the .mind file bytes
      window.__mindBuffer = Array.from(buffer);
      window.__compileStatus = 'done';
    } catch (e) {
      window.__compileStatus = 'error: ' + e.message;
      console.error(e);
    }
  })();
</script>
</body>
</html>
